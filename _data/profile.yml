short_bio: >-
  I am Yuqi Xiong, a graduate student in Electrical and Computer Engineering at the National University of Singapore. My research interests focus on machine learning, deep learning, big data mining, computer vision, and intelligent autonomous systems. My research experience spans time series forecasting, salient object detection, and multi-UAV path planning and task allocation. I am currently working on AI-generated image detection with Assoc Prof Robby Tan from Yale-NUS College.I am particularly interested in developing robust and efficient learning-based methods for complex and dynamic environments.

